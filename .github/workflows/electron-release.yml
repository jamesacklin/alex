name: Build Electron App on Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Release tag to upload artifacts to (e.g., v0.3.0). Leave empty to skip upload.'
        required: false
        type: string

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare notarization key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          : "${APPLE_API_KEY:?Missing APPLE_API_KEY secret}"
          : "${APPLE_API_KEY_ID:?Missing APPLE_API_KEY_ID secret}"
          : "${APPLE_API_ISSUER:?Missing APPLE_API_ISSUER secret}"
          NOTARIZATION_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$NOTARIZATION_KEY"
          chmod 600 "$NOTARIZATION_KEY"
          echo "APPLE_API_KEY=$NOTARIZATION_KEY" >> "$GITHUB_ENV"

      - name: Build Electron app
        run: pnpm electron:build:mac:release
        env:
          ALEX_DESKTOP: 'true'
          # Developer ID Application certificate exported as a password-protected
          # .p12 and stored as a base64 GitHub Actions secret.
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          # APPLE_API_KEY is the temporary key path prepared above. These
          # credentials let electron-builder notarize and staple the signed app.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: List built files
        run: |
          echo "Built files in dist/:"
          ls -lh dist/

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION=${GITHUB_REF_NAME#v}
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Upload macOS package to release
        if: github.event_name == 'release' || github.event.inputs.upload_to_release != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event_name == 'release' && github.ref_name || github.event.inputs.upload_to_release }}
          files: |
            dist/*.zip
            dist/*.dmg
          fail_on_unmatched_files: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew cask
        if: github.event_name == 'release'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ZIP_NAME=$(ls -1 dist/*-arm64-mac.zip | head -1 | xargs basename)
          SHA=$(shasum -a 256 "dist/${ZIP_NAME}" | awk '{print $1}')

          echo "Tag: ${TAG}, Version: ${VERSION}, ZIP: ${ZIP_NAME}, SHA: ${SHA}"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/jamesacklin/homebrew-alex.git" /tmp/homebrew-tap
          cd /tmp/homebrew-tap

          cat > Casks/alex.rb << EOF
          cask "alex" do
            version "${VERSION}"
            sha256 "${SHA}"

            url "https://github.com/jamesacklin/alex/releases/download/${TAG}/${ZIP_NAME}",
                verified: "github.com/jamesacklin/alex/"
            name "Alex"
            desc "Personal reading and document library"
            homepage "https://github.com/jamesacklin/alex"

            depends_on macos: ">= :ventura"
            depends_on arch: :arm64

            app "Alex.app"

            zap trash: [
              "~/Library/Application Support/Alex",
              "~/Library/Caches/com.alex.app",
              "~/Library/Logs/Alex",
              "~/Library/Preferences/com.alex.app.plist",
            ]
          end
          EOF

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add Casks/alex.rb
          git diff --cached --quiet && echo "No changes to cask" && exit 0
          git commit -m "Update alex to ${VERSION}"
          git push

      - name: Build summary
        run: |
          echo "## macOS Electron App Built :apple:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Built Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -1 dist/*.{zip,dmg} 2>/dev/null | sed 's|dist/||' >> $GITHUB_STEP_SUMMARY || echo "No macOS artifacts found" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Notarized macOS ZIP and DMG packages have been uploaded to the release page." >> $GITHUB_STEP_SUMMARY

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron app
        run: pnpm electron:build:linux
        env:
          ALEX_DESKTOP: 'true'

      - name: List built files
        run: |
          echo "Built files in dist/:"
          ls -lh dist/

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION=${GITHUB_REF_NAME#v}
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Upload Linux packages to release
        if: github.event_name == 'release' || github.event.inputs.upload_to_release != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event_name == 'release' && github.ref_name || github.event.inputs.upload_to_release }}
          files: |
            dist/*.AppImage
            dist/*.deb
          fail_on_unmatched_files: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        run: |
          echo "## Linux Electron App Built :penguin:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Built Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -1 dist/*.{AppImage,deb} 2>/dev/null | sed 's|dist/||' >> $GITHUB_STEP_SUMMARY || echo "No package files found" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All Linux packages have been uploaded to the release page." >> $GITHUB_STEP_SUMMARY
