appId: com.alex.app
productName: Alex
copyright: Copyright © 2025

# Don't auto-publish to GitHub - we manually upload via workflow
publish: null

directories:
  output: dist
  buildResources: electron/icons

files:
  - .next/standalone/**/*
  - public/**/*
  - src/lib/db/**/*
  - electron/dist/**/*
  - package.json

extraResources:
  - from: watcher-rs/dist
    to: watcher-rs
    filter:
      - "**/*"

asar: true
asarUnpack:
  - "**/*.node"
  - "**/canvas/**"

mac:
  icon: macos/icon.icns
  target:
    - target: zip
      arch:
        - arm64
  # DMGs are produced by the release workflow alongside the ZIP used by Homebrew.
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.inherit.plist
  notarize: true

win:
  icon: windows/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  publisherName: Alex

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  icon: linux/icons/512x512.png
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  category: Utility

# Local builds remain unsigned unless signing credentials are supplied. The
# release workflow supplies a Developer ID certificate and notarization key.
